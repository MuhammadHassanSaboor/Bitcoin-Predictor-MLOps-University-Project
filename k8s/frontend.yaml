# React dashboard (Nginx, non-root) served at http://btc-forecast.local/
# Its Nginx forwards /api/* to the API Service named below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast-ui
  labels:
    app: btc-forecast-ui
    app.kubernetes.io/part-of: btc-forecast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: btc-forecast-ui
  template:
    metadata:
      labels:
        app: btc-forecast-ui
        app.kubernetes.io/part-of: btc-forecast
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginx-unprivileged
      containers:
        - name: ui
          image: hassansaboor/btc-forecast-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: btc-forecast-api:80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-ui
  labels:
    app: btc-forecast-ui
    app.kubernetes.io/part-of: btc-forecast
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
