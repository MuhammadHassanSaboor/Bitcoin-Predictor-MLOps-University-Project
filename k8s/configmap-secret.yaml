# D1 - app settings kept outside the code, injected as environment variables
# (see envFrom in deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  labels:
    app.kubernetes.io/part-of: btc-forecast
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  # One Gunicorn worker per pod keeps memory inside the 512Mi limit;
  # the HPA scales out by adding pods instead.
  GUNICORN_WORKERS: "1"
  MAPE_THRESHOLD: "10"
---
# Sensitive values. The key below is a placeholder for local Minikube use only;
# replace it without committing the real one:
#   kubectl create secret generic btc-api-secret \
#     --from-literal=API_KEY=<your-key> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  labels:
    app.kubernetes.io/part-of: btc-forecast
type: Opaque
stringData:
  API_KEY: "change-me-k8s-local"
